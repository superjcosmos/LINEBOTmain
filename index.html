  <div class="login-box">
    <div class="logo">
      <p>J Cosmos</p>
      <h1>LINE BOT API 管理後台</h1>
    </div>

    <div class="form-group">
      <label>電子信箱</label>
      <input type="email" id="inputEmail" placeholder="your@email.com"
             onkeydown="if(event.key==='Enter') document.getElementById('inputPassword').focus()">
    </div>

    <div class="form-group">
      <label>密碼</label>
      <div style="position:relative">
        <input type="password" id="inputPassword" placeholder="••••••••"
               onkeydown="if(event.key==='Enter') login()"
               onkeyup="checkCapsLock(event)"
               style="padding-right:44px;width:100%">
        <button type="button" id="btnTogglePwd" onclick="togglePassword()"
                title="顯示/隱藏密碼"
                style="position:absolute;right:12px;top:50%;transform:translateY(-50%);
                       background:none;border:none;cursor:pointer;font-size:18px;color:#aaa;padding:0">
          👁
        </button>
      </div>
      <div id="capsLockWarning"
           style="display:none;color:#f39c12;font-size:12px;margin-top:4px">
        ⚠️ 大寫鎖定已開啟
      </div>
    </div>

    <button class="btn-login" id="btnLogin" onclick="login()">登入</button>
    <div class="error-msg" id="errorMsg"></div>

    <div style="text-align:center;margin-top:14px;font-size:14px;">
      <a href="#" onclick="showForgotPassword();return false;">
        忘記密碼？
      </a>
    </div>
  </div>

<!-- ================================================================
     忘記密碼頁
     ================================================================ -->
<div id="forgotPasswordPage">
  <div class="auth-stars" id="forgotStars"></div>
  <div class="login-box">

    <!-- Step 1：輸入 Email -->
    <div id="forgotStep1">
      <div class="logo">
        <p>J Cosmos</p>
        <h1>忘記密碼</h1>
      </div>
      <p style="color:#666;font-size:14px;margin-bottom:20px;text-align:center;">
        輸入您的登入 Email，我們將寄送 6 位數驗證碼
      </p>
      <div class="form-group">
        <label>電子信箱</label>
        <input type="email" id="forgotEmail" placeholder="your@email.com"
               onkeydown="if(event.key==='Enter') submitForgotPassword()">
      </div>
      <div class="error-msg" id="forgotStep1Error"></div>
      <button id="btnSendOtp" class="btn-login" onclick="submitForgotPassword()">
        寄送驗證碼
      </button>
      <div style="text-align:center;margin-top:14px;font-size:14px;">
        <a href="#" onclick="showLoginPage();return false;">← 返回登入</a>
      </div>
    </div>

    <!-- Step 2：輸入 OTP -->
    <div id="forgotStep2" style="display:none;">
      <div class="logo">
        <p>J Cosmos</p>
        <h1>輸入驗證碼</h1>
      </div>
      <p style="color:#666;font-size:14px;margin-bottom:4px;text-align:center;">
        驗證碼已寄至 <strong id="otpEmailHint" style="color:#333;"></strong>
      </p>
      <p style="color:#f39c12;font-size:12px;margin-bottom:20px;text-align:center;">
        ⏱ 請於 10 分鐘內完成驗證
      </p>
      <div class="form-group">
        <label>6 位數驗證碼</label>
        <input type="text" id="otpInput" placeholder="123456"
               maxlength="6" inputmode="numeric" pattern="[0-9]*"
               style="font-size:24px;letter-spacing:10px;text-align:center;"
               oninput="this.value=this.value.replace(/[^0-9]/g,'')"
               onkeydown="if(event.key==='Enter') submitVerifyOtp()">
      </div>
      <div class="error-msg" id="forgotStep2Error"></div>
      <button id="btnVerifyOtp" class="btn-login" onclick="submitVerifyOtp()">
        驗證
      </button>
      <div style="text-align:center;margin-top:14px;font-size:14px;
                  display:flex;justify-content:center;gap:16px;">
        <a href="#" onclick="resendOtp();return false;">重新寄送驗證碼</a>
        <span style="color:#ccc;">|</span>
        <a href="#" onclick="showLoginPage();return false;" style="color:#666;">返回登入</a>
      </div>
    </div>

    <!-- Step 3：設定新密碼 -->
    <div id="forgotStep3" style="display:none;">
      <div class="logo">
        <p>J Cosmos</p>
        <h1>設定新密碼</h1>
      </div>
      <p style="color:#666;font-size:14px;margin-bottom:20px;text-align:center;">
        請為您的帳號設定新密碼
      </p>
      <div class="form-group">
        <label>新密碼</label>
        <input type="password" id="newPassword" placeholder="至少 6 個字元"
               oninput="updatePasswordStrength()"
               onkeydown="if(event.key==='Enter') document.getElementById('confirmPassword').focus()">
        <div id="passwordStrength" style="font-size:12px;margin-top:4px;min-height:16px;"></div>
      </div>
      <div class="form-group">
        <label>確認新密碼</label>
        <input type="password" id="confirmPassword" placeholder="再輸入一次"
               onkeydown="if(event.key==='Enter') submitResetPassword()">
      </div>
      <div class="error-msg" id="forgotStep3Error"></div>
      <button id="btnResetPassword" class="btn-login" onclick="submitResetPassword()">
        確認重設密碼
      </button>
      <div style="text-align:center;margin-top:14px;font-size:14px;">
        <a href="#" onclick="showLoginPage();return false;" style="color:#666;">返回登入</a>
      </div>
    </div>

  </div>
</div>

    </div>
  </div>
  <div class="main-content" id="mainContent">
    <div class="loading">載入中...</div>
  </div>
</div>

<!-- ── 星點生成（登入頁 + 忘記密碼頁 + Sidebar）── -->
<script>
function _makeStars(containerId, count) {
  var c = document.getElementById(containerId);
  if (!c) return;
  for (var i = 0; i < count; i++) {
    var s = document.createElement('div');
    s.className = 'sb-star';
    var size = Math.random() < 0.12 ? 2 : Math.random() < 0.45 ? 1.5 : 1;
    var dur  = (2.5 + Math.random() * 3).toFixed(1);
    var del  = (Math.random() * 5).toFixed(1);
    var lo   = (0.1  + Math.random() * 0.15).toFixed(2);
    var hi   = (0.55 + Math.random() * 0.45).toFixed(2);
    s.style.cssText =
      'width:'  + size + 'px;' +
      'height:' + size + 'px;' +
      'left:'   + (Math.random() * 100) + '%;' +
      'top:'    + (Math.random() * 100) + '%;' +
      '--dur:'  + dur  + 's;' +
      '--del:-' + del  + 's;' +
      '--lo:'   + lo   + ';' +
      '--hi:'   + hi   + ';';
    c.appendChild(s);
  }
}
_makeStars('loginStars',   90);
_makeStars('forgotStars',  90);
_makeStars('sidebarStars', 70);
</script>
